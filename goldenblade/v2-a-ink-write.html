<!doctype html>
<title>Ink &amp; Gold</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yellowtail&family=Rokkitt:wght@600;700&family=Jost:wght@400;500;600&display=swap');

  :root{
    --ink:        #050403;
    --ink-2:      #100C08;
    --gold-1:     #8A6423;
    --gold-2:     #D9B565;
    --gold-3:     #FBE7A8;
    --gold-4:     #C9A24B;
    --gold-5:     #7A5A22;
    --gold-bright:#F1D488;
    --paper:      #EFE7D8;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink);
    color:var(--paper);
    width:100vw; height:100vh;
    overflow:hidden;
    font-family:'Jost',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .flip-scene{ position:fixed; inset:0; perspective:1800px; }
  .flip-card{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transform:rotateY(0deg);
  }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 46%, var(--ink-2) 0%, var(--ink) 78%);
  }
  .face-back{ transform:rotateY(180deg); }

  .wm-gold{
    background-image:linear-gradient(100deg, var(--gold-1), var(--gold-2) 25%, var(--gold-3) 50%, var(--gold-4) 75%, var(--gold-5));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .lockup{ text-align:center; }
  .wordmark-wrap{ position:relative; display:inline-block; }

  .wm-text-clip{ overflow:hidden; clip-path:inset(0 100% 0 0); }
  .wm-text{
    white-space:nowrap;
    font-family:'Yellowtail', cursive;
    font-size:clamp(34px, 6.2vw, 64px);
    line-height:1.05;
    padding:0 4px;
  }
  .wm-hidden{ color:transparent; }

  .glint{
    position:absolute; top:8%; width:34px; height:84%;
    background:linear-gradient(100deg, transparent, rgba(255,244,214,.9) 45%, transparent 80%);
    filter:blur(3px);
    opacity:0; pointer-events:none;
    transform:translateX(-20px);
  }

  .razor-el{ position:absolute; pointer-events:none; }
  .razor-el svg{ display:block; width:100%; height:100%; overflow:visible; }

  .underline-wrap{ margin-top:2px; width:100%; }
  .underline-wrap svg{ display:block; width:100%; height:20px; overflow:visible; }
  .uline{ fill:none; stroke:url(#ulGrad); stroke-width:3; stroke-linecap:round; }

  .sub{
    margin-top:14px;
    font-family:'Rokkitt', serif; font-weight:700;
    font-size:clamp(13px, 1.7vw, 19px);
    letter-spacing:14px;
    color:var(--paper);
    opacity:0;
    text-indent:14px;
  }

  .caption{ position:fixed; left:28px; bottom:26px; z-index:20; opacity:0; }
  .caption .kicker{ font-size:11px; letter-spacing:3px; color:var(--gold-4); text-transform:uppercase; }
  .caption .title{ font-family:'Rokkitt'; font-weight:700; font-size:14px; letter-spacing:1px; color:var(--paper); margin-top:4px; }

  .replay{
    position:fixed; right:28px; bottom:26px; z-index:20;
    display:flex; align-items:center; gap:8px;
    background:transparent; border:1px solid rgba(201,162,75,.55);
    color:var(--gold-bright); font-family:'Jost'; font-size:11px; letter-spacing:3px;
    text-transform:uppercase; padding:10px 16px; border-radius:2px;
    cursor:pointer; opacity:0; transition:background .2s, color .2s;
  }
  .replay:hover{ background:var(--gold-4); color:var(--ink); }
  .replay:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }

  .back-label{ text-align:center; opacity:.55; }
  .back-label .eyebrow{ font-size:11px; letter-spacing:4px; color:var(--gold-4); text-transform:uppercase; }
  .back-label .name{ font-family:'Yellowtail'; font-size:40px; color:var(--paper); margin-top:10px; }
  .back-label .note{ font-size:12px; color:#8b8478; margin-top:14px; max-width:34ch; }
</style>

<div class="flip-scene">
  <div class="flip-card" id="flipCard">
    <div class="face face-front">
      <div class="lockup">
        <div class="wordmark-wrap" id="wordmarkWrap">
          <div class="wm-text-clip" id="wmClip">
            <span class="wm-text">
              <span class="wm-gold">Golden</span><span class="wm-gold">B</span><span class="wm-hidden" id="hiddenL">l</span><span class="wm-gold">ade</span>
            </span>
          </div>
          <div class="glint" id="glint"></div>
          <div class="razor-el" id="razorEl">
            <svg viewBox="0 0 260 150" preserveAspectRatio="none">
              <defs>
                <linearGradient id="razorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%"  stop-color="#8A6423"/>
                  <stop offset="30%" stop-color="#D9B565"/>
                  <stop offset="55%" stop-color="#FBE7A8"/>
                  <stop offset="80%" stop-color="#C9A24B"/>
                  <stop offset="100%" stop-color="#7A5A22"/>
                </linearGradient>
              </defs>
              <rect x="30" y="6" width="22" height="112" rx="10" fill="url(#razorGrad)"/>
              <g id="bladeGroup" style="transform-origin:41px 118px;">
                <polygon points="41,110 150,101 246,96 152,118 41,126" fill="url(#razorGrad)"/>
              </g>
              <circle cx="41" cy="118" r="8.5" fill="#3a2a10" stroke="url(#razorGrad)" stroke-width="2.5"/>
            </svg>
          </div>

          <div class="underline-wrap">
            <svg viewBox="0 0 400 20" preserveAspectRatio="none">
              <defs>
                <linearGradient id="ulGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#7A5A22"/>
                  <stop offset="50%" stop-color="#F1D488"/>
                  <stop offset="100%" stop-color="#7A5A22"/>
                </linearGradient>
              </defs>
              <path class="uline" id="ulinePath" d="M6,10 C 90,2 310,2 394,10"/>
            </svg>
          </div>
        </div>

        <div class="sub">BARBERSHOP</div>
      </div>
    </div>

    <div class="face face-back">
      <div class="back-label">
        <div class="eyebrow">Coming soon</div>
        <div class="name">GoldenBlade</div>
        <div class="note">Homepage not built yet — this is only the opening-animation transition, standing in for where the site will load.</div>
      </div>
    </div>
  </div>
</div>

<div class="caption">
  <div class="kicker">Concept A</div>
  <div class="title">Ink &amp; Gold</div>
</div>
<button class="replay" id="replayBtn" type="button">&#8635; Replay</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function positionRazor(){
    var wrap = document.getElementById("wordmarkWrap");
    var hiddenL = document.getElementById("hiddenL");
    var razor = document.getElementById("razorEl");
    var wrapRect = wrap.getBoundingClientRect();
    var lRect = hiddenL.getBoundingClientRect();

    var h = lRect.height * 1.0;
    var w = h * (260 / 150);
    var left = (lRect.left - wrapRect.left) - h * 0.05;
    var top  = (lRect.top - wrapRect.top);

    razor.style.width = w + "px";
    razor.style.height = h + "px";
    razor.style.left = left + "px";
    razor.style.top = top + "px";
  }
  positionRazor();
  window.addEventListener("resize", positionRazor);

  var ulinePath = document.getElementById("ulinePath");
  var ulen = ulinePath.getTotalLength();
  ulinePath.style.strokeDasharray = ulen;
  ulinePath.style.strokeDashoffset = ulen;

  var bladeGroup = document.getElementById("bladeGroup");
  var flipCard = document.getElementById("flipCard");

  function buildTimeline(){
    var tl = gsap.timeline({ paused:true });

    if (reduced){
      tl.set("#wmClip", { clipPath:"inset(0 0% 0 0)" })
        .set(".sub", { opacity:1, letterSpacing:"14px" })
        .set(ulinePath, { strokeDashoffset:0 })
        .set(bladeGroup, { rotation:0 })
        .set([".caption",".replay"], { opacity:1 })
        .to({}, { duration:1.4 })
        .to(flipCard, { rotationY:180, duration:.8, ease:"power2.inOut" });
      return tl;
    }

    tl.set("#wmClip", { clipPath:"inset(0 100% 0 0)" })
      .set("#glint", { opacity:0, left:"0%" })
      .set(".sub", { opacity:0, letterSpacing:"34px" })
      .set(ulinePath, { strokeDashoffset:ulen })
      .set(bladeGroup, { rotation:0, transformOrigin:"41px 118px" })
      .set([".caption",".replay"], { opacity:0 })
      .set(flipCard, { rotationY:0 });

    tl.to("#glint", { opacity:1, duration:.15 }, 0.15)
      .to("#wmClip", { clipPath:"inset(0 65% 0 0)", duration:.38, ease:"power1.out" }, 0.15)
      .to("#glint", { left:"35%", duration:.38, ease:"power1.out" }, 0.15)
      .to("#wmClip", { clipPath:"inset(0 28% 0 0)", duration:.32, ease:"power1.inOut" }, 0.53)
      .to("#glint", { left:"72%", duration:.32, ease:"power1.inOut" }, 0.53)
      .to("#wmClip", { clipPath:"inset(0 0% 0 0)", duration:.36, ease:"power1.in" }, 0.85)
      .to("#glint", { left:"100%", duration:.36, ease:"power1.in" }, 0.85)
      .to("#glint", { opacity:0, duration:.2 }, 1.05)

      .to(".sub", { opacity:1, letterSpacing:"14px", duration:.5, ease:"power2.out" }, 1.15)
      .to(ulinePath, { strokeDashoffset:0, duration:.55, ease:"power2.out" }, 1.25)

      .to(bladeGroup, { rotation:-98, duration:.12, ease:"power2.in" }, 2.05)
      .to(bladeGroup, { rotation:0,   duration:.14, ease:"back.out(2.2)" }, 2.19)
      .to(bladeGroup, { rotation:-98, duration:.11, ease:"power2.in" }, 2.42)
      .to(bladeGroup, { rotation:0,   duration:.16, ease:"back.out(1.8)" }, 2.55)

      .to([".caption",".replay"], { opacity:1, duration:.6 }, 3.0)
      .to({}, { duration:.7 })
      .to(flipCard, { rotationY:180, duration:.9, ease:"power2.inOut" });

    return tl;
  }

  var tl = buildTimeline();
  tl.play();

  document.getElementById("replayBtn").addEventListener("click", function(){
    tl.kill();
    gsap.set(flipCard, { rotationY:0 });
    positionRazor();
    tl = buildTimeline();
    tl.play(0);
  });
})();
</script>
